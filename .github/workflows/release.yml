# Builds RishFlow for Windows, macOS and Linux.
# Push a tag matching APP_VERSION in app.py (e.g. `git tag v2.1.0 && git push origin v2.1.0`)
# to publish a GitHub Release with all three installers attached.
# Run it manually from the Actions tab to just build and test.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: an older glibc, so the Linux build also runs on older distros
        os: [windows-latest, macos-latest, ubuntu-22.04]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: RishFlow UI Design/package-lock.json

      - name: Build UI
        working-directory: RishFlow UI Design
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux libraries for Qt WebEngine
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Test
        run: python -m pytest tests -q

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Build app and installer
        run: python packaging/build_exe.py --package

      - uses: actions/upload-artifact@v4
        with:
          name: RishFlow-${{ runner.os }}
          path: |
            release/RishFlow-*-Setup.exe
            release/RishFlow-*.dmg
            release/RishFlow-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
